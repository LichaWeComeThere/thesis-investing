name: Lockfile Bootstrap

on:
  push:
    branches:
      - codex/phase-0-stage-1-foundation
  workflow_dispatch:

permissions:
  contents: write

jobs:
  add-lockfile:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest

    steps:
      - name: Check out PR branch
        uses: actions/checkout@v4
        with:
          ref: codex/phase-0-stage-1-foundation
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Generate lockfile and frozen installs
        run: |
          pnpm install --lockfile-only
          python - <<'PY'
          from pathlib import Path

          for file_name in [
              '.github/workflows/ci.yml',
              '.github/workflows/windows-build.yml',
          ]:
              path = Path(file_name)
              text = path.read_text()
              text = text.replace(
                  'run: pnpm install\n',
                  'run: pnpm install --frozen-lockfile\n',
              )
              path.write_text(text)

          Path('.github/workflows/lockfile-bootstrap.yml').unlink()
          PY

      - name: Commit cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pnpm-lock.yaml .github/workflows/ci.yml .github/workflows/windows-build.yml .github/workflows/lockfile-bootstrap.yml
          if git diff --cached --quiet; then
            echo "No cleanup changes to commit."
          else
            git commit -m "Add pnpm lockfile and frozen installs"
            git push origin HEAD:codex/phase-0-stage-1-foundation
          fi
