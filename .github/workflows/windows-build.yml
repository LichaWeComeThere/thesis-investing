name: Windows Build

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - apps/desktop/**
      - packages/**
      - .github/workflows/windows-build.yml
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml

jobs:
  windows-package:
    name: Windows package
    runs-on: windows-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build all workspaces
        run: pnpm build

      - name: Verify SQLite inside Electron
        run: pnpm --filter @thesis-investing/desktop exec electron ./out/main/verifyStorageRuntime.js

      - name: Verify desktop runtime and native encrypted credentials
        run: pnpm --filter @thesis-investing/desktop exec node ./scripts/verifyDesktopRuntime.mjs

      - name: Package Windows app
        run: pnpm package:windows

      - name: Upload Windows unpacked artifact
        uses: actions/upload-artifact@v4
        with:
          name: thesis-investing-windows-unpacked
          path: apps/desktop/release/windows/win-unpacked/**
          if-no-files-found: error
