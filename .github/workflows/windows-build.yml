name: Windows Build

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - apps/desktop/**
      - packages/**
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml

jobs:
  windows-build-placeholder:
    name: Windows build placeholder
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: pnpm install

      - name: Build desktop app
        run: pnpm --filter @thesis-investing/desktop build

      - name: Artifact placeholder
        run: echo "Windows packaging artifacts will be added in a later phase."
