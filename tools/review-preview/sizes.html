<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Research workspace · Window sizes</title><style>body{margin:0;background:#05080c;color:#f4f7fa;font:14px system-ui}header{display:flex;gap:20px;align-items:center;padding:10px 16px;min-height:36px}select{font:inherit;padding:6px;background:#111821;color:#f4f7fa;border:1px solid #354352;border-radius:6px}iframe{display:block;border:0}</style></head><body><header>Example workspace · Fictional research<label>Window size <select id="size"><option value="1487,1058">Large desktop · 1487 × 1058</option><option value="1100,720">Desktop · 1100 × 720</option><option value="860,560">Small desktop · 860 × 560</option><option value="390,844">Compact · 390 × 844</option></select></label></header><iframe title="Thesis Investing preview" src="/" width="1487" height="1058"></iframe><script type="module">const select=document.querySelector('select');const frame=document.querySelector('iframe');select.addEventListener('change',()=>{const [width,height]=select.value.split(',');frame.width=width;frame.height=height;});</script></body></html>
